name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          JSR=$(python3 -c 'import json; print(json.load(open("jsr.json"))["version"])')
          DENO=$(python3 -c 'import json; print(json.load(open("deno.json"))["version"])')
          if [ "$JSR" != "$DENO" ]; then
            echo "jsr.json ($JSR) and deno.json ($DENO) versions differ"
            exit 1
          fi
          if [ "$TAG" != "$JSR" ]; then
            echo "Tag v$TAG does not match package version $JSR"
            exit 1
          fi
      - name: Verify
        run: |
          deno task test
          deno publish --dry-run
      - name: Publish to JSR
        run: deno publish
